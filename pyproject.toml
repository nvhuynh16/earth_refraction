[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "earth-refraction"
version = "0.1.0"
description = "Atmospheric and ocean refractive index computation with 3D ray tracing on WGS-84"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nen Huynh"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = [
    "refraction", "ray-tracing", "eikonal", "atmosphere", "ocean",
    "WGS84", "radio", "sonar", "acoustics", "NRLMSIS",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/nvhuynh16/earth_refraction"
Source = "https://github.com/nvhuynh16/earth_refraction"
Issues = "https://github.com/nvhuynh16/earth_refraction/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.scikit-build]
wheel.packages = ["python/src/refraction"]
cmake.build-type = "Release"
# Keep the sdist to what is needed to build and test; never ship docs/ (reference papers).
sdist.exclude = [".gitignore", ".github", "docs", "examples", "*.png"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = ["pytest"]
# Smoke-test each wheel against the compiled module; the full suite runs in CI.
test-command = "pytest {project}/python/tests/test_native.py -q"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
